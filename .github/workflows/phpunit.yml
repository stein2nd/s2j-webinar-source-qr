name: PHPUnit

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  phpunit-pure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit PHPUnit (no WordPress DB)
        run: composer test:unit

  phpunit-wp-env:
    runs-on: ubuntu-latest
    needs: phpunit-pure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      # package.json の `phpunit:wp-env` → `test:unit:php` (`pretest:unit:php` で wp-env 起動)。未定義 script だとここで即 fail する。
      - name: Run PHPUnit in wp-env
        run: npm run phpunit:wp-env
